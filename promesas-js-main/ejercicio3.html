<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador</title>
<link rel="stylesheet" href="estilos.css">

</head>
<body class="dragonball">
  <main>
    <h1>Buscador Dragon Ball</h1>
    <form id="formBuscador">
      <div class="busqueda">
        <input type="text" id="idbuscado" placeholder="Ejem. 1">
        <button type="submit">Buscar</button>
      </div>
 
      <p id="mensaje"></p>
 
      <div class="resultado" id="resultado" hidden>
      <img id="imagen" alt="Imagen" hidden>
      <div>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">
      </div>
      <div>
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion"></textarea>
      </div>
      </div>
    </form>
  </main>
 
  <script>
    const formulario = document.getElementById('formBuscador')
    const idBuscado = document.getElementById('idbuscado')
    const mensaje = document.getElementById('mensaje')
    const resultado = document.getElementById('resultado')
    const imagen = document.getElementById('imagen')
    const nombre = document.getElementById('nombre')
    const descripcion = document.getElementById('descripcion')
 
    formulario.addEventListener("submit", (event) => {
      event.preventDefault()  
      obtenerDatos(idBuscado.value.trim())
    })
 
    function limpiar() {
      resultado.hidden = true
      imagen.hidden = true
      nombre.value = ''
      descripcion.value = ''
    }
 
    async function obtenerDatos(id) {
      limpiar()
      mensaje.textContent = ""
 
      const urls = [
        `https://dragonball-api.com/api/characters/${id}`
      ]
 
      try {
        let respuesta
        for (const url of urls) {
          try { respuesta = await fetch(url); break } catch (e) { console.error(e) }
        }
 
        if (!respuesta) { throw new Error('Sin conexión con la API') }
 
        if (id === "") {
            mensaje.textContent = "Ingresa un ID"
            return
        }
        if (!respuesta.ok) { throw new Error('Error de comunicación') }
 
        const datos = await respuesta.json()
 
        imagen.src = datos.image
        imagen.hidden = false
        nombre.value = datos.name
        descripcion.value = datos.description
        resultado.hidden = false
      } catch (e) {
        console.error(e)
        mensaje.textContent = 'No se pudo consultar la API. Inténtalo de nuevo.'
      }
    }
  </script>
</body>
</html>
