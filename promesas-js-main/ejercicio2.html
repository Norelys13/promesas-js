<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="estilos.css">

</head>
<body>
  <main>
    <h1>Buscador de naves espaciales</h1>
    <form id="formBuscador">
      <div class="busqueda">
        <input type="text" id="idbuscado" placeholder="Ejem. 9">
        <button type="submit">Buscar</button>
      </div>
 
      <p id="mensaje"></p>
 
      <div class="resultado" id="resultado" hidden>
      <div>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">
      </div>
      <div>
        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo">
      </div>
      <div>
        <label for="fabricante">Fabricante:</label>
        <input type="text" id="fabricante">
      </div>
      <div>
        <label for="clase">Clase:</label>
        <input type="text" id="clase">
      </div>
      <div>
        <label for="costo">Costo (créditos):</label>
        <input type="text" id="costo">
      </div>
      </div>
    </form>
  </main>
 
  <script>
    const formulario = document.getElementById('formBuscador')
    const idBuscado = document.getElementById('idbuscado')
    const mensaje = document.getElementById('mensaje')
    const resultado = document.getElementById('resultado')
    const nombre = document.getElementById('nombre')
    const modelo = document.getElementById('modelo')
    const fabricante = document.getElementById('fabricante')
    const clase = document.getElementById('clase')
    const costo = document.getElementById('costo')
 
    formulario.addEventListener("submit", (event) => {
      event.preventDefault() 
      obtenerDatos(idBuscado.value.trim())
    })
 
    function limpiar() {
      resultado.hidden = true
      nombre.value = ''
      modelo.value = ''
      fabricante.value = ''
      clase.value = ''
      costo.value = ''
    }
 
    async function obtenerDatos(id) {
      limpiar()
      mensaje.textContent = ""
 
      const urls = [
        `https://swapi.dev/api/starships/${id}/`,
        `https://swapi.py4e.com/api/starships/${id}/`
      ]
 
      try {
        let respuesta
        for (const url of urls) {
          try { respuesta = await fetch(url); break } catch (e) { console.error(e) }
        }
 
        if (!respuesta) { throw new Error('Sin conexión con la API') }

        if (id === "") {
            mensaje.textContent = "Ingresa un ID"
            return
        }
        if (!respuesta.ok) { throw new Error('Error de comunicación') }
 
        const datos = await respuesta.json()
 
        nombre.value = datos.name
        modelo.value = datos.model
        fabricante.value = datos.manufacturer
        clase.value = datos.starship_class
        costo.value = datos.cost_in_credits
        resultado.hidden = false
      } catch (e) {
        console.error(e)
        mensaje.textContent = 'No se pudo consultar la API. Inténtalo de nuevo.'
      }
    }
  </script>
</body>
</html>
